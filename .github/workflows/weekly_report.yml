name: Rodeo Report

on:
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl
      - name: Generate report
        run: |
          python3 -c "
          import sys, os
          from pathlib import Path
          from datetime import date
          sys.path.insert(0, '.')
          from engine import run_match, build_excel
          alpha = sorted(Path('watched_folder').glob('*.csv'), key=lambda p: p.stat().st_mtime, reverse=True)
          alpha = alpha or sorted(Path('watched_folder').glob('*.xlsx'), key=lambda p: p.stat().st_mtime, reverse=True)
          detail, totals, stats = run_match(str(alpha[0]), 'reference_data/card_numbers.xlsx', 'reference_data/suspended_list.xlsx')
          os.makedirs('reports', exist_ok=True)
          build_excel(detail, totals, stats, f'reports/Fines_Card_Verification_{date.today()}.xlsx')
          print(stats)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: reports/
          retention-days: 90
