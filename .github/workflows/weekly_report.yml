name: Weekly Rodeo Report

on:
  # Run manually from the GitHub Actions tab whenever needed
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the repo ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install pandas openpyxl

      # ── 4. Find the most recent alpha sheet ───────────────────────────────
      - name: Locate alpha sheet
        id: find_alpha
        run: |
          # Find most recently modified CSV or XLSX in watched_folder
          ALPHA=$(ls -t watched_folder/*.csv watched_folder/*.xlsx 2>/dev/null | head -1)
          if [ -z "$ALPHA" ]; then
            echo "::error::No CSV or XLSX found in watched_folder/"
            exit 1
          fi
          echo "alpha_path=$ALPHA" >> $GITHUB_OUTPUT
          echo "Found alpha sheet: $ALPHA"

      # ── 5. Run the matching engine & build the report ─────────────────────
      - name: Generate report
        run: |
          python3 - << 'EOF'
          import sys, os
          from pathlib import Path
          from datetime import date

          sys.path.insert(0, str(Path(__file__).parent if hasattr(__file__, '__file__') else Path('.')))

          # Resolve paths
          alpha_path = os.environ['ALPHA_PATH']
          card_path  = 'reference_data/card_numbers.xlsx'
          susp_path  = 'reference_data/suspended_list.xlsx'

          from engine import run_match, build_excel

          print(f"Alpha sheet : {alpha_path}")
          print(f"Card list   : {card_path}")
          print(f"Susp list   : {susp_path}")

          detail_rows, totals_rows, stats = run_match(alpha_path, card_path, susp_path)

          os.makedirs('reports', exist_ok=True)
          out_name = f"Fines_Card_Verification_{date.today()}.xlsx"
          out_path = f"reports/{out_name}"
          build_excel(detail_rows, totals_rows, stats, out_path)

          print(f"\n✓ Report saved: {out_path}")
          print(f"  Total entrants : {stats['total_entrants']}")
          print(f"  Flagged names  : {stats['flagged_names']}")
          print(f"  Suspended      : {stats['susp_matches']}")
          print(f"  Card matches   : {stats['card_matches']}")
          print(f"  Total owed     : ${stats['total_owed']:,.2f}")

          # Write summary to env for next step
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"REPORT_PATH={out_path}\n")
              f.write(f"REPORT_NAME={out_name}\n")
              f.write(f"STAT_FLAGGED={stats['flagged_names']}\n")
              f.write(f"STAT_SUSPENDED={stats['susp_matches']}\n")
              f.write(f"STAT_CARDS={stats['card_matches']}\n")
              f.write(f"STAT_OWED={stats['total_owed']:.2f}\n")
          EOF
        env:
          ALPHA_PATH: ${{ steps.find_alpha.outputs.alpha_path }}

      # ── 6. Upload the report as a GitHub Actions artifact ─────────────────
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_NAME }}
          path: ${{ env.REPORT_PATH }}
          retention-days: 90

      # ── 7. Commit the report back to the repo ─────────────────────────────
      - name: Commit report to repo
        run: |
          git config user.name  "Rodeo Checker Bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Weekly report: $REPORT_NAME  |  Flagged: $STAT_FLAGGED  Suspended: $STAT_SUSPENDED  Owed: \$$STAT_OWED"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Post a summary to the Actions run page ─────────────────────────
      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Rodeo Checker — Weekly Report
          | Metric | Value |
          |--------|-------|
          | Total Entrants | ${{ env.STAT_FLAGGED && '' }} |
          | Flagged Names | **$STAT_FLAGGED** |
          | Suspended Matches | **$STAT_SUSPENDED** |
          | Card # Matches | $STAT_CARDS |
          | Total \$ Owed | **\$$STAT_OWED** |

          📥 Download the report from the **Artifacts** section above.
          EOF
